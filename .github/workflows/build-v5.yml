name: AI Fotograaf Pro V5 - Photos by Loes

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V5 APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Controleer V5 ZIP
        run: |
        test -f AI_Fotograaf_PRO_V5_Photos_by_Loes_FINAL_GitHub.zip 

      - name: V5 project uitpakken
        run: |
          rm -rf v5-source
          mkdir v5-source
          unzip -o AI_Fotograaf_PRO_V5_Photos_by_Loes_FINAL_GitHub.zip -d v5-source 

      - name: Zoek Android project
        run: |
          SETTINGS=$(find v5-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Controleer APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/app/build/outputs/apk/debug/app-debug.apk" | head -1)
          test -n "$APK"
          echo "APK gevonden: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-V5-Photos-by-Loes
          path: ${{ env.APK }}
          if-no-files-found: error
