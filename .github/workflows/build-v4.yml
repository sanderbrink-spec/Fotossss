name: AI Fotograaf Pro V4 - Photos by Loes

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build AI Fotograaf Pro V4
    runs-on: ubuntu-22.04

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Java 17 installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: V4 ZIP uitpakken
        run: |
          unzip -o AI_Fotograaf_PRO_V4_Photos_by_Loes_GitHub.zip -d v4-source
          echo "V4 project:"
          find v4-source -maxdepth 3 -type f | sort

      - name: APK bouwen
        working-directory: v4-source/AI_Fotograaf_PRO_V4
        run: |
          gradle assembleDebug --no-daemon

      - name: APK controleren
        run: |
          find v4-source -name "app-debug.apk" -print

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-V4-Photos-by-Loes
          path: v4-source/AI_Fotograaf_PRO_V4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
