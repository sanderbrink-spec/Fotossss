name: AI Fotograaf Pro V2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build AI Fotograaf Pro V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2 project
        run: |
          unzip -o AI_Fotograaf_PRO_V2_GitHub.zip
          ls -la
          ls -la AI_Fotograaf_PRO_V2

      - name: Build APK
        working-directory: AI_Fotograaf_PRO_V2
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-V2-APK
          path: AI_Fotograaf_PRO_V2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
