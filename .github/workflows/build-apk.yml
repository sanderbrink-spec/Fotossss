name: Build AI Fotograaf Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP uitpakken
        run: |
          mkdir project
          unzip -q AI_Fotograaf_Pro*.zip -d project
          find project -type f -maxdepth 3

      - name: Android SDK controleren
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        working-directory: project/AI_Fotograaf_Pro_GitHub_READY
        run: gradle assembleDebug --stacktrace

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-APK
          path: project/AI_Fotograaf_Pro_GitHub_READY/app/build/outputs/apk/debug/app-debug.apk
