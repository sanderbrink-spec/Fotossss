name: Build AI Fotograaf Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: ZIP uitpakken
        run: |
          unzip -o AI_Fotograaf_Pro*.zip
          rm -f AI_Fotograaf_Pro*.zip

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK instellen
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        run: |
          gradle assembleDebug --stacktrace

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
