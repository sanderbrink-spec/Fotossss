name: AI Fotograaf Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Java instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android project uit ZIP halen
        run: |
          unzip -o AI_Fotograaf_Pro_GitHub_READY.zip

      - name: Gradle instellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        run: |
          gradle assembleDebug

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
