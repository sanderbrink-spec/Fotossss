name: AI Fotograaf Pro V5 CLEAN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build V5 APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Zoek V5 ZIP
        run: |
          echo "Beschikbare ZIP-bestanden:"
          find . -type f -iname "*.zip" -print

          ZIP=$(find . -type f -iname "*AI_Fotograaf_PRO_V5_CLEAN*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname "*AI_Fotograaf_PRO_V5*.zip" | head -1)
          fi

          if [ -z "$ZIP" ]; then
            echo "GEEN V5 ZIP GEVONDEN"
            exit 1
          fi

          echo "Gevonden: $ZIP"
          echo "V5_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Project uitpakken
        run: |
          rm -rf v5-build
          mkdir v5-build
          unzip -q "$V5_ZIP" -d v5-build

          echo "Projectinhoud:"
          find v5-build -maxdepth 3 -type f | sort

      - name: Zoek Android project
        run: |
          SETTINGS=$(find v5-build -type f -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle niet gevonden"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Bouw APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Zoek APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK NIET GEVONDEN"
            exit 1
          fi

          echo "APK gevonden:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-V5-CLEAN
          path: ${{ env.APK }}
          if-no-files-found: error
