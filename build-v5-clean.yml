name: AI Fotograaf Pro V5 Clean

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build V5 APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find clean V5 ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'AI_Fotograaf_PRO_V5_CLEAN.zip' -print -quit)
          test -n "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract V5 project
        run: |
          rm -rf v5-build
          mkdir v5-build
          unzip -q "${{ steps.zip.outputs.zip }}" -d v5-build
          test -f v5-build/settings.gradle
          test -f v5-build/app/build.gradle
          test -f v5-build/app/src/main/java/nl/aifotograaf/pro/MainActivity.java

      - name: Build Debug APK
        working-directory: v5-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: test -f v5-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fotograaf-Pro-V5-Clean
          path: v5-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
